services:
  factorio:
    image: factorio-dedicated-server:latest
    container_name: factorio
    ports:
      - "34197:34197/udp" # Game
      #- "27015:27015/tcp" # RCON
    environment:
      SAVEGAME_NAME: server # Name of save file (without .zip)
      USE_WHITELIST: false # Enable whitelist
      #RCON_PW: "" # RCON password - If null or empty, disabled
    volumes:
      - ./volumes/config:/opt/factorio/config
      - ./volumes/mods:/opt/factorio/mods
      - ./volumes/saves:/opt/factorio/saves
